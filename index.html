<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Official user and integration manual for the LMNT Framework." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>LMNT Framework Manual</title>
  <style>
    :root {
      --intro-bg: #f8fafc;
      --intro-muted: #64748b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --intro-bg: #0b1018;
        --intro-muted: #94a3b8;
      }
    }

    html[data-theme="light"] {
      --intro-bg: #f8fafc;
      --intro-muted: #64748b;
    }

    html[data-theme="dark"] {
      --intro-bg: #0b1018;
      --intro-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    /* Deliberately neutral wrapper. Never filter/transform this element:
       the injected manual contains its own fixed header and sticky navigation. */
    #manual-root {
      min-height: 100vh;
    }

    #lmnt-intro {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Blur and veil the already-correct page from the overlay itself.
       This avoids changing any geometry or positioning inside the manual. */
    #lmnt-backdrop {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--intro-bg);
      -webkit-backdrop-filter: blur(20px) saturate(.80);
      backdrop-filter: blur(20px) saturate(.80);
      will-change: background, backdrop-filter;
      transition:
        background 3150ms cubic-bezier(.22,.8,.28,1),
        -webkit-backdrop-filter 3150ms cubic-bezier(.22,.8,.28,1),
        backdrop-filter 3150ms cubic-bezier(.22,.8,.28,1);
    }

    /* Long reveal. Keep enough veil + blur that LMNT still has a visual stage. */
    #lmnt-intro.is-revealing #lmnt-backdrop {
      background: color-mix(in srgb, var(--intro-bg) 52%, transparent);
      -webkit-backdrop-filter: blur(10px) saturate(.90);
      backdrop-filter: blur(10px) saturate(.90);
    }

    /* Logo and final veil disappear together. */
    #lmnt-intro.is-finishing #lmnt-backdrop {
      background: transparent;
      -webkit-backdrop-filter: blur(0) saturate(1);
      backdrop-filter: blur(0) saturate(1);
      transition-duration: 1150ms;
    }

    #lmnt-intro.is-fast #lmnt-backdrop {
      background: transparent;
      -webkit-backdrop-filter: blur(0) saturate(1);
      backdrop-filter: blur(0) saturate(1);
      transition-duration: 900ms;
    }

    #lmnt-intro-mark {
      position: relative;
      z-index: 2;
      width: min(440px, 74vw);
      height: auto;
      filter: drop-shadow(0 18px 30px rgba(15,23,42,.08));
      transition:
        opacity 1050ms ease,
        transform 1100ms cubic-bezier(.22,.9,.3,1),
        filter 1100ms ease;
    }

    #lmnt-intro.is-revealing #lmnt-intro-mark {
      filter: drop-shadow(0 14px 26px rgba(15,23,42,.06));
    }

    #lmnt-intro.is-finishing #lmnt-intro-mark,
    #lmnt-intro.is-fast #lmnt-intro-mark {
      opacity: 0;
      transform: scale(.955);
      filter: blur(1.5px) drop-shadow(0 10px 20px rgba(15,23,42,.04));
    }

    #lmnt-intro.is-fast #lmnt-intro-mark {
      transition-duration: 850ms, 900ms, 900ms;
    }

    #lmnt-skip-hint {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      margin: 0;
      color: var(--intro-muted);
      font: 500 12px/1.4 "Geist Variable", "Geist", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .035em;
      opacity: 0;
      animation: lmnt-hint-in 500ms ease 900ms forwards;
      transition: opacity 300ms ease;
      white-space: nowrap;
    }

    #lmnt-intro.is-revealing #lmnt-skip-hint {
      opacity: .38;
    }

    #lmnt-intro.is-finishing #lmnt-skip-hint,
    #lmnt-intro.is-fast #lmnt-skip-hint {
      opacity: 0;
    }

    @keyframes lmnt-hint-in {
      from { opacity: 0; transform: translate(-50%, 4px); }
      to { opacity: .72; transform: translate(-50%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      #lmnt-intro-mark { display: none; }
      #lmnt-skip-hint { display: none; }
      #lmnt-backdrop {
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="manual-root" aria-live="polite"></div>

  <div id="lmnt-intro" role="button" tabindex="0" aria-label="LMNT introduction. Tap or press Enter to continue faster.">
    <div id="lmnt-backdrop" aria-hidden="true"></div>
    <img id="lmnt-intro-mark" src="./lmnt-loading.svg" alt="LMNT" />
    <p id="lmnt-skip-hint">Tap anywhere to continue faster</p>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const intro = document.getElementById('lmnt-intro');
      const manualRoot = document.getElementById('manual-root');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      try {
        const savedTheme = localStorage.getItem('lmnt-doc-theme');
        if (savedTheme) root.dataset.theme = savedTheme;
      } catch { /* storage can be unavailable */ }

      let finished = false;
      let revealStarted = false;
      let revealTimer;
      let finishTimer;

      function runManualScript(scriptText) {
        const script = document.createElement('script');
        script.textContent = scriptText;
        document.body.appendChild(script);
      }

      async function loadManual() {
        try {
          const response = await fetch('./manual.html', { cache: 'no-cache' });
          if (!response.ok) throw new Error(`Manual request failed: ${response.status}`);

          const source = await response.text();
          const parsed = new DOMParser().parseFromString(source, 'text/html');

          const manualStyle = parsed.querySelector('style');
          if (manualStyle) {
            const style = document.createElement('style');
            style.textContent = manualStyle.textContent;
            document.head.appendChild(style);
          }

          const title = parsed.querySelector('title');
          if (title?.textContent) document.title = title.textContent;

          manualRoot.innerHTML = parsed.body.innerHTML;

          const manualScript = parsed.querySelector('script');
          if (manualScript?.textContent) runManualScript(manualScript.textContent);
        } catch (error) {
          console.error(error);
          window.location.replace(`./manual.html${window.location.hash || ''}`);
        }
      }

      function startReveal() {
        if (finished || revealStarted) return;
        revealStarted = true;
        intro.classList.add('is-revealing');
      }

      function completeIntro(fast = false) {
        if (finished) return;
        finished = true;
        clearTimeout(revealTimer);
        clearTimeout(finishTimer);

        if (fast) {
          intro.classList.add('is-fast');
        } else {
          startReveal();
          intro.classList.add('is-finishing');
        }

        const delay = reducedMotion ? 0 : (fast ? 950 : 1180);

        window.setTimeout(() => {
          intro.remove();
        }, delay);
      }

      function accelerate() {
        if (finished) return;
        completeIntro(true);
      }

      intro.addEventListener('pointerdown', accelerate, { once: true });
      intro.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ' || event.key === 'Escape') {
          event.preventDefault();
          accelerate();
        }
      });

      loadManual();

      if (reducedMotion) {
        finishTimer = window.setTimeout(() => completeIntro(false), 150);
      } else {
        revealTimer = window.setTimeout(startReveal, 2850);
        finishTimer = window.setTimeout(() => completeIntro(false), 6000);
      }
    })();
  </script>
</body>
</html>
