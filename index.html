<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Official user and integration manual for the LMNT Framework." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>LMNT Framework Manual</title>
  <style>
    :root {
      --intro-bg: #f8fafc;
      --intro-text: #111827;
      --intro-muted: #64748b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --intro-bg: #0b1018;
        --intro-text: #f4f4f5;
        --intro-muted: #94a3b8;
      }
    }

    html[data-theme="light"] {
      --intro-bg: #f8fafc;
      --intro-text: #111827;
      --intro-muted: #64748b;
    }

    html[data-theme="dark"] {
      --intro-bg: #0b1018;
      --intro-text: #f4f4f5;
      --intro-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    #manual-root {
      min-height: 100vh;
      opacity: 0;
      transition: opacity 900ms ease;
    }

    #manual-root.is-ready { opacity: 1; }

    #lmnt-intro {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #lmnt-curtain {
      position: absolute;
      inset: -2px;
      background: var(--intro-bg);
      clip-path: circle(150% at 50% 50%);
      will-change: clip-path, opacity;
      animation: lmnt-curtain-reveal 2600ms cubic-bezier(.7,0,.25,1) 3400ms forwards;
    }

    #lmnt-intro-mark {
      position: relative;
      z-index: 2;
      width: min(440px, 74vw);
      height: auto;
      filter: drop-shadow(0 18px 30px rgba(15,23,42,.08));
      transition: opacity 650ms ease, transform 650ms cubic-bezier(.22,.9,.3,1);
    }

    #lmnt-skip-hint {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      margin: 0;
      color: var(--intro-muted);
      font: 500 12px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .04em;
      opacity: 0;
      animation: lmnt-hint-in 500ms ease 900ms forwards;
      transition: opacity 260ms ease;
      white-space: nowrap;
    }

    #lmnt-intro.is-finishing #lmnt-curtain,
    #lmnt-intro.is-fast #lmnt-curtain {
      animation: none;
      clip-path: circle(0% at 50% 50%);
      transition: clip-path 900ms cubic-bezier(.7,0,.25,1);
    }

    #lmnt-intro.is-finishing #lmnt-intro-mark,
    #lmnt-intro.is-fast #lmnt-intro-mark {
      opacity: 0;
      transform: scale(.96);
    }

    #lmnt-intro.is-finishing #lmnt-skip-hint,
    #lmnt-intro.is-fast #lmnt-skip-hint { opacity: 0; }

    @keyframes lmnt-curtain-reveal {
      0% { clip-path: circle(150% at 50% 50%); }
      100% { clip-path: circle(0% at 50% 50%); }
    }

    @keyframes lmnt-hint-in {
      from { opacity: 0; transform: translate(-50%, 4px); }
      to { opacity: .72; transform: translate(-50%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      #lmnt-curtain { animation: none; }
      #lmnt-intro-mark { display: none; }
      #lmnt-skip-hint { display: none; }
    }
  </style>
</head>
<body>
  <main id="manual-root" aria-live="polite"></main>

  <div id="lmnt-intro" role="button" tabindex="0" aria-label="LMNT introduction. Tap or press Enter to continue faster.">
    <div id="lmnt-curtain" aria-hidden="true"></div>
    <img id="lmnt-intro-mark" src="./lmnt-loading.svg" alt="LMNT" />
    <p id="lmnt-skip-hint">Tap anywhere to continue faster</p>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const intro = document.getElementById('lmnt-intro');
      const manualRoot = document.getElementById('manual-root');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      try {
        const savedTheme = localStorage.getItem('lmnt-doc-theme');
        if (savedTheme) root.dataset.theme = savedTheme;
      } catch { /* storage can be unavailable */ }

      let finished = false;
      let finishTimer;

      function runManualScript(scriptText) {
        const script = document.createElement('script');
        script.textContent = scriptText;
        document.body.appendChild(script);
      }

      async function loadManual() {
        try {
          const response = await fetch('./manual.html', { cache: 'no-cache' });
          if (!response.ok) throw new Error(`Manual request failed: ${response.status}`);

          const source = await response.text();
          const parsed = new DOMParser().parseFromString(source, 'text/html');

          const manualStyle = parsed.querySelector('style');
          if (manualStyle) {
            const style = document.createElement('style');
            style.textContent = manualStyle.textContent;
            document.head.appendChild(style);
          }

          const title = parsed.querySelector('title');
          if (title?.textContent) document.title = title.textContent;

          manualRoot.innerHTML = parsed.body.innerHTML;
          manualRoot.classList.add('is-ready');

          const manualScript = parsed.querySelector('script');
          if (manualScript?.textContent) runManualScript(manualScript.textContent);
        } catch (error) {
          console.error(error);
          window.location.replace(`./manual.html${window.location.hash || ''}`);
        }
      }

      function completeIntro(fast = false) {
        if (finished) return;
        finished = true;
        clearTimeout(finishTimer);

        intro.classList.add(fast ? 'is-fast' : 'is-finishing');
        const delay = reducedMotion ? 0 : (fast ? 950 : 700);

        window.setTimeout(() => {
          intro.remove();
        }, delay);
      }

      function accelerate() {
        if (finished) return;
        completeIntro(true);
      }

      intro.addEventListener('pointerdown', accelerate, { once: true });
      intro.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ' || event.key === 'Escape') {
          event.preventDefault();
          accelerate();
        }
      });

      loadManual();

      if (reducedMotion) {
        finishTimer = window.setTimeout(() => completeIntro(false), 150);
      } else {
        finishTimer = window.setTimeout(() => completeIntro(false), 6000);
      }
    })();
  </script>
</body>
</html>
