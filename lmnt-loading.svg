<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 64" fill="none" aria-label="LMNT loading">
  <defs>
    <linearGradient id="lmnt-loading-gradient" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00BFA5"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <radialGradient id="lmnt-glow-gradient">
      <stop offset="0" stop-color="#00BFA5" stop-opacity=".28"/>
      <stop offset=".52" stop-color="#007AFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#007AFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="lmnt-soft-blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <clipPath id="lmnt-text-reveal">
      <rect class="lmnt-text-mask" x="58" y="0" width="0" height="64" rx="2"/>
    </clipPath>
  </defs>
  <style>
    .lmnt-scene { transform: translate(36px, 0); }
    .lmnt-logo-track { transform: translateX(22px); transform-box: fill-box; transform-origin: center; animation: lmnt-logo-shift 820ms cubic-bezier(.22,.86,.28,1) 2380ms forwards; }
    .lmnt-pulse-wrap { transform-box: fill-box; transform-origin: center; animation: lmnt-breathe 1.65s ease-in-out 3320ms infinite; }
    .lmnt-cube { opacity: 0; transform-box: fill-box; transform-origin: center; will-change: transform, opacity; }
    .lmnt-cube-1 { animation: lmnt-drop-1 1650ms cubic-bezier(.14,.80,.22,1.02) 0ms forwards; }
    .lmnt-cube-2 { animation: lmnt-drop-2 1700ms cubic-bezier(.14,.80,.22,1.02) 180ms forwards; }
    .lmnt-cube-3 { animation: lmnt-drop-3 1670ms cubic-bezier(.14,.80,.22,1.02) 360ms forwards; }
    .lmnt-cube-4 { animation: lmnt-drop-4 1730ms cubic-bezier(.14,.80,.22,1.02) 540ms forwards; }
    .lmnt-stroke { stroke: #111827; }
    .lmnt-word { opacity: 0; fill: #111827; font-family: "Geist Variable", "Geist", ui-sans-serif, system-ui, sans-serif; font-size: 24px; font-weight: 540; font-variation-settings: "wght" 540; letter-spacing: .075em; transform: translateX(-12px); animation: lmnt-word-in 760ms cubic-bezier(.22,.86,.28,1) 2480ms forwards; }
    .lmnt-text-mask { animation: lmnt-mask-reveal 860ms cubic-bezier(.22,.86,.28,1) 2430ms forwards; }
    .lmnt-shadow-track { transform: translateX(22px); animation: lmnt-shadow-shift 820ms cubic-bezier(.22,.86,.28,1) 2380ms forwards; }
    .lmnt-ground-shadow { opacity: 0; fill: rgba(17, 24, 39, .14); transform-box: fill-box; transform-origin: center; animation: lmnt-shadow-settle 1050ms ease-out 1180ms forwards; }
    .lmnt-glow-track { transform: translateX(22px); animation: lmnt-glow-shift 820ms cubic-bezier(.22,.86,.28,1) 2380ms forwards; }
    .lmnt-glow { opacity: 0; transform-box: fill-box; transform-origin: center; animation: lmnt-glow-arrive 680ms ease-out 2240ms forwards, lmnt-glow-pulse 1.65s ease-in-out 3320ms infinite; }
    @media (prefers-color-scheme: dark) { .lmnt-stroke { stroke: #f4f4f5; } .lmnt-word { fill: #f4f4f5; } .lmnt-ground-shadow { fill: rgba(0,0,0,.36); } }
    @keyframes lmnt-drop-1 { 0% { opacity:0; transform:translate(-14px,-96px) rotate(-248deg) scale(.42); } 18% { opacity:.42; transform:translate(-11px,-74px) rotate(-206deg) scale(.52); } 34% { opacity:.72; transform:translate(-7px,-40px) rotate(-132deg) scale(.70); } 56% { opacity:1; transform:translate(4px,8px) rotate(28deg) scale(1.058,.944); } 70% { transform:translate(-2px,-3.4px) rotate(-14deg) scale(.99,1.01); } 82% { transform:translate(.9px,1.35px) rotate(6deg) scale(1.01,.992); } 92% { transform:translate(-.28px,-.42px) rotate(-1.8deg) scale(.998,1.002); } 100% { opacity:1; transform:translate(0,0) rotate(0deg) scale(1); } }
    @keyframes lmnt-drop-2 { 0% { opacity:0; transform:translate(16px,-112px) rotate(336deg) scale(.36); } 18% { opacity:.40; transform:translate(13px,-86px) rotate(282deg) scale(.48); } 34% { opacity:.70; transform:translate(8px,-46px) rotate(192deg) scale(.68); } 56% { opacity:1; transform:translate(-4px,9.2px) rotate(-34deg) scale(1.064,.94); } 70% { transform:translate(1.9px,-3.7px) rotate(16deg) scale(.988,1.012); } 82% { transform:translate(-.8px,1.45px) rotate(-7deg) scale(1.01,.992); } 92% { transform:translate(.28px,-.46px) rotate(2deg) scale(.998,1.002); } 100% { opacity:1; transform:translate(0,0) rotate(0deg) scale(1); } }
    @keyframes lmnt-drop-3 { 0% { opacity:0; transform:translate(-16px,-103px) rotate(284deg) scale(.40); } 18% { opacity:.42; transform:translate(-12px,-79px) rotate(228deg) scale(.5); } 34% { opacity:.72; transform:translate(-8px,-43px) rotate(148deg) scale(.69); } 56% { opacity:1; transform:translate(3.8px,8.4px) rotate(-26deg) scale(1.056,.944); } 70% { transform:translate(-1.8px,-3.2px) rotate(12deg) scale(.99,1.01); } 82% { transform:translate(.8px,1.2px) rotate(-5deg) scale(1.01,.992); } 92% { transform:translate(-.24px,-.4px) rotate(1.6deg) scale(.998,1.002); } 100% { opacity:1; transform:translate(0,0) rotate(0deg) scale(1); } }
    @keyframes lmnt-drop-4 { 0% { opacity:0; transform:translate(15px,-122px) rotate(-382deg) scale(.34); } 18% { opacity:.38; transform:translate(11px,-94px) rotate(-316deg) scale(.46); } 34% { opacity:.68; transform:translate(7px,-52px) rotate(-214deg) scale(.66); } 56% { opacity:1; transform:translate(-3.6px,10px) rotate(38deg) scale(1.07,.936); } 70% { transform:translate(1.6px,-4px) rotate(-18deg) scale(.987,1.013); } 82% { transform:translate(-.7px,1.55px) rotate(7deg) scale(1.011,.991); } 92% { transform:translate(.22px,-.48px) rotate(-2.2deg) scale(.998,1.002); } 100% { opacity:1; transform:translate(0,0) rotate(0deg) scale(1); } }
    @keyframes lmnt-logo-shift { 0% { transform:translateX(22px) scale(1); } 52% { transform:translateX(5px) scale(.925); } 100% { transform:translateX(0) scale(.90); } }
    @keyframes lmnt-shadow-shift { 0% { transform:translateX(22px); } 100% { transform:translateX(0); } }
    @keyframes lmnt-glow-shift { 0% { transform:translateX(22px); } 100% { transform:translateX(0); } }
    @keyframes lmnt-mask-reveal { from { width:0; } to { width:86px; } }
    @keyframes lmnt-word-in { 0% { opacity:0; transform:translateX(-12px); } 100% { opacity:1; transform:translateX(0); } }
    @keyframes lmnt-shadow-settle { 0% { opacity:0; transform:scaleX(.45); } 58% { opacity:.18; transform:scaleX(1.12); } 100% { opacity:.11; transform:scaleX(1); } }
    @keyframes lmnt-glow-arrive { from { opacity:0; transform:scale(.62); } to { opacity:.58; transform:scale(1); } }
    @keyframes lmnt-breathe { 0%,100% { transform:scale(1); opacity:.94; } 50% { transform:scale(1.042); opacity:1; } }
    @keyframes lmnt-glow-pulse { 0%,100% { opacity:.34; transform:scale(.92); } 50% { opacity:.68; transform:scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .lmnt-logo-track,.lmnt-pulse-wrap,.lmnt-cube,.lmnt-word,.lmnt-text-mask,.lmnt-shadow-track,.lmnt-ground-shadow,.lmnt-glow-track,.lmnt-glow { animation:none !important; } .lmnt-logo-track { transform:translateX(0) scale(.9); } .lmnt-shadow-track,.lmnt-glow-track { transform:translateX(0); } .lmnt-cube,.lmnt-word { opacity:1; transform:none; } .lmnt-text-mask { width:86px; } .lmnt-ground-shadow { opacity:.11; } .lmnt-glow { opacity:.40; } }
  </style>
  <g class="lmnt-scene">
    <g class="lmnt-shadow-track"><ellipse class="lmnt-ground-shadow" cx="32" cy="52" rx="18" ry="4.4"/></g>
    <g class="lmnt-glow-track"><ellipse class="lmnt-glow" cx="32" cy="31" rx="25" ry="22" fill="url(#lmnt-glow-gradient)" filter="url(#lmnt-soft-blur)"/></g>
    <g class="lmnt-logo-track"><g class="lmnt-pulse-wrap">
      <g class="lmnt-cube lmnt-cube-1"><g transform="translate(21 18) rotate(-14) scale(1.35)" stroke-linejoin="round"><path class="lmnt-stroke" d="M0 -6L6 -3L0 0L-6 -3L0 -6Z" stroke-width="1.35"/><path class="lmnt-stroke" d="M-6 -3L0 0V7L-6 4V-3Z" fill="url(#lmnt-loading-gradient)" opacity=".62" stroke-width="1.35"/><path class="lmnt-stroke" d="M6 -3L0 0V7L6 4V-3Z" fill="url(#lmnt-loading-gradient)" opacity=".78" stroke-width="1.35"/></g></g>
      <g class="lmnt-cube lmnt-cube-2"><g transform="translate(43 20) rotate(17) scale(1.15)" stroke-linejoin="round"><path class="lmnt-stroke" d="M0 -6L6 -3L0 0L-6 -3L0 -6Z" fill="url(#lmnt-loading-gradient)" stroke-width="1.35"/><path class="lmnt-stroke" d="M-6 -3L0 0V7L-6 4V-3Z" fill="url(#lmnt-loading-gradient)" opacity=".62" stroke-width="1.35"/><path class="lmnt-stroke" d="M6 -3L0 0V7L6 4V-3Z" fill="url(#lmnt-loading-gradient)" opacity=".78" stroke-width="1.35"/></g></g>
      <g class="lmnt-cube lmnt-cube-3"><g transform="translate(19 40) rotate(9) scale(1.2)" stroke-linejoin="round"><path class="lmnt-stroke" d="M0 -6L6 -3L0 0L-6 -3L0 -6Z" fill="url(#lmnt-loading-gradient)" stroke-width="1.35"/><path class="lmnt-stroke" d="M-6 -3L0 0V7L-6 4V-3Z" fill="url(#lmnt-loading-gradient)" opacity=".62" stroke-width="1.35"/><path class="lmnt-stroke" d="M6 -3L0 0V7L6 4V-3Z" fill="url(#lmnt-loading-gradient)" opacity=".78" stroke-width="1.35"/></g></g>
      <g class="lmnt-cube lmnt-cube-4"><g transform="translate(43 43) rotate(-18) scale(1.3)" stroke-linejoin="round"><path class="lmnt-stroke" d="M0 -6L6 -3L0 0L-6 -3L0 -6Z" stroke-width="1.35"/><path class="lmnt-stroke" d="M-6 -3L0 0V7L-6 4V-3Z" fill="url(#lmnt-loading-gradient)" opacity=".62" stroke-width="1.35"/><path class="lmnt-stroke" d="M6 -3L0 0V7L6 4V-3Z" fill="url(#lmnt-loading-gradient)" opacity=".78" stroke-width="1.35"/></g></g>
    </g></g>
    <g clip-path="url(#lmnt-text-reveal)"><text class="lmnt-word" x="62" y="39">LMNT</text></g>
  </g>
</svg>
